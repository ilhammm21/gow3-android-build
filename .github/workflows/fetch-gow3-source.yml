name: GOW3 Android ARM64 - Fetch Exact Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-gow3-source.yml'

permissions:
  contents: read

jobs:
  source:
    name: Fetch release source and submodules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout our project repository
        uses: actions/checkout@v4

      - name: Install Git and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build

      - name: Clone exact upstream release with submodules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          git clone --branch windows-v2.1.7 --depth 1 --recurse-submodules \
            https://github.com/FelipePrado0/gow3_pc.git upstream
          cd upstream
          git submodule update --init --recursive
          {
            echo "GOW3 upstream source fetch report"
            echo "Repository: https://github.com/FelipePrado0/gow3_pc"
            echo "Requested release tag: windows-v2.1.7"
            echo "Resolved commit: $(git rev-parse HEAD)"
            echo
            echo "=== Submodule status ==="
            git submodule status --recursive
            echo
            echo "=== Required paths ==="
            for p in \
              gpu/third_party/fsr-vulkan/CMakeLists.txt \
              gpu/third_party/imgui/imgui.h \
              gpu/third_party/magic_enum/include/magic_enum.hpp \
              gpu/third_party/miniz/miniz.h \
              gpu/third_party/xbyak/xbyak/xbyak.h \
              third_party/LibAtrac9/C/src; do
              if [[ -e "$p" ]]; then echo "PRESENT  $p"; else echo "MISSING  $p"; fi
            done
            echo
            echo "=== Android/desktop assumptions in GPU CMake ==="
            grep -n -E 'find_package\\(Vulkan|find_package\\(Boost|pkg_check_modules\\(SDL3|pkg_check_modules\\(X11|pkg_check_modules\\(FFMPEG|find_package\\(Zydis|if \\(NOT WIN32\\)|PkgConfig::X11' gpu/CMakeLists.txt || true
            echo
            echo "=== Source facts ==="
            grep -n -E 'Windows 10|x86-64|No game files are included|Linux \\(AppImage, experimental\\)' README.md || true
          } > ../audit/upstream-source-report.txt

      - name: Upload source audit report
        uses: actions/upload-artifact@v4
        with:
          name: GOW3-Upstream-Source-Report
          path: audit/upstream-source-report.txt
          if-no-files-found: error
          retention-days: 14
