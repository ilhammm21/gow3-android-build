name: Android ARM64 Port Preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Android ARM64 Source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout starter repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build python3

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Clone game source
        run: |
          git clone --recurse-submodules \
            --branch windows-v2.1.7 \
            https://github.com/FelipePrado0/gow3_pc.git \
            gow3_pc

      - name: Check source and toolchain
        run: |
          mkdir -p output
          echo "Android ARM64 preparation report" > output/report.txt
          echo "" >> output/report.txt
          echo "NDK path: $ANDROID_NDK_HOME" >> output/report.txt
          echo "Source commit:" >> output/report.txt
          git -C gow3_pc rev-parse HEAD >> output/report.txt
          echo "" >> output/report.txt
          echo "Submodule status:" >> output/report.txt
          git -C gow3_pc submodule status >> output/report.txt
          echo "" >> output/report.txt
          echo "CMake files:" >> output/report.txt
          find gow3_pc -name CMakeLists.txt -print >> output/report.txt
          echo "Preparation report created."

      - name: Upload preparation artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-preparation
          path: output/report.txt
          if-no-files-found: error
          retention-days: 7
