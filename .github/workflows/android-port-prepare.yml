```yaml
name: Android ARM64 Port Preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout starter repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git cmake ninja-build python3 \
            openjdk-17-jdk

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Clone game source with submodules
        run: |
          git clone --recurse-submodules \
            --branch windows-v2.1.7 \
            https://github.com/FelipePrado0/gow3_pc.git \
            gow3_pc

      - name: Record Android build environment
        run: |
          echo "=== Android NDK ==="
          echo "$ANDROID_NDK_HOME"
          echo "=== NDK compiler ==="
          find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" \
            -name 'aarch64-linux-android*-clang' \
            -type f | head -n 5
          echo "=== Source commit ==="
          git -C gow3_pc rev-parse HEAD
          echo "=== Submodule status ==="
          git -C gow3_pc submodule status
          echo "=== Android build files ==="
          find gow3_pc -maxdepth 4 \
            \( -name 'build.gradle*' \
            -o -name 'Android.mk' \
            -o -name 'Application.mk' \
            -o -name 'CMakeLists.txt' \) \
            -print

      - name: Upload preparation report
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-preparation
          path: |
            gow3_pc/CMakeLists.txt
          if-no-files-found: warn
          retention-days: 7
```
 
