name: Android ARM64 Runtime Port

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 ripgrep

      - name: Clone source
        run: |
          git clone --recurse-submodules \
            --branch windows-v2.1.7 \
            https://github.com/FelipePrado0/gow3_pc.git \
            gow3_pc

      - name: Inspect runtime portability
        run: |
          mkdir -p output
          {
            echo "=== Runtime source files ==="
            find gow3_pc/src -maxdepth 2 -type f
            echo
            echo "=== Platform-specific APIs ==="
            rg -n \
              'VirtualAlloc2|VirtualProtect|VirtualFree|mmap|mprotect|CreateThread|pthread|__Ux86_64_setcontext' \
              gow3_pc/src || true
            echo
            echo "=== Build entry points ==="
            find gow3_pc -maxdepth 2 -type f \
              \( -name 'build.sh' \
              -o -name 'CMakeLists.txt' \
              -o -name 'shell.nix' \) -print
          } | tee output/runtime-report.txt

      - name: Upload runtime report
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-runtime-report
          path: output/runtime-report.txt
          if-no-files-found: error
          retention-days: 7
